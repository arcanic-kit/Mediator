name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.0)'
        required: true
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest

    # The "release" environment holds the NUGET_USER secret, can enforce protection
    # rules (required reviewers, allowed branches/tags), and is the environment the
    # NuGet.org trusted publishing policy is restricted to.
    environment: release

    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to GitHub Packages
      id-token: write   # issue the OIDC token used for NuGet trusted publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history so the main-branch check below can run

    - name: Verify commit is on main
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Releases must be cut from a commit on main ($GITHUB_SHA is not on origin/main)."
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # Extract version from tag (remove 'v' prefix)
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"

    - name: Restore dependencies
      run: dotnet restore Arcanic.Mediator.slnx

    - name: Build solution
      run: |
        dotnet build Arcanic.Mediator.slnx \
          --configuration Release \
          --no-restore \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0 \
          -p:FileVersion=${{ steps.version.outputs.VERSION }}.0 \
          -p:DebugType=portable \
          -p:DebugSymbols=true

    - name: Run tests
      run: |
        dotnet test Arcanic.Mediator.slnx \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage

    - name: Clean packages directory
      run: |
        rm -rf ./packages
        mkdir -p ./packages

    - name: Create packages 
      run: |
        # Pack only the src projects, excluding samples and test projects
        for project in src/*/*.csproj; do
          if [ -f "$project" ]; then
            # Skip if project path contains "sample" or "test" (case insensitive)
            if [[ ! "$project" =~ [Ss]ample ]] && [[ ! "$project" =~ [Tt]est ]]; then
              echo "Packing: $project"
              dotnet pack "$project" \
                --configuration Release \
                --no-build \
                --output ./packages \
                -p:Version=${{ steps.version.outputs.VERSION }} \
                -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0 \
                -p:FileVersion=${{ steps.version.outputs.VERSION }}.0 \
                -p:IncludeSymbols=true \
                -p:SymbolPackageFormat=snupkg \
                -p:DebugType=portable \
                -p:DebugSymbols=true
            else
              echo "Skipping sample/test project: $project"
            fi
          fi
        done

    - name: List and verify packages
      run: |
        echo "Generated packages:"
        ls -la ./packages/
        echo ""
        echo "Package details:"
        for pkg in ./packages/*.nupkg; do
          if [ -f "$pkg" ]; then
            echo "Package: $(basename $pkg)"
            unzip -l "$pkg" | grep -E '\.(dll|pdb)$' || echo "No DLL/PDB files found"
            echo "---"
          fi
        done

    - name: Verify package content
      run: |
        echo "Checking for symbol package issues..."
        for snupkg in ./packages/*.snupkg; do
          if [ -f "$snupkg" ]; then
            pkg_name=$(basename "$snupkg" .snupkg).nupkg
            if [ -f "./packages/$pkg_name" ]; then
              echo "Checking symbol package: $(basename $snupkg)"
              # List contents of symbol package
              echo "PDB files in symbol package:"
              unzip -l "$snupkg" | grep '\.pdb$' || echo "No PDB files in symbol package"
              # List DLLs in main package
              echo "DLL files in main package:"
              unzip -l "./packages/$pkg_name" | grep '\.dll$' || echo "No DLL files in main package"
              echo "---"
            fi
          fi
        done

    # Trusted publishing: exchange this job's GitHub OIDC token for a NuGet API key
    # that is valid for 1 hour, so no long-lived key is stored in the repository.
    # Requires a Trusted Publishing policy on nuget.org for this repository, the
    # workflow file "release.yml" and the environment "release", plus the NUGET_USER
    # secret (nuget.org profile name) in the "release" environment.
    - name: NuGet login (OIDC → temporary API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        echo "Pushing main packages..."
        for pkg in ./packages/*.nupkg; do
          if [ -f "$pkg" ]; then
            echo "Pushing: $(basename $pkg)"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate \
              --timeout 300
          fi
        done

    - name: Publish to GitHub Packages
      run: |
        echo "Pushing main packages..."
        for pkg in ./packages/*.nupkg; do
          if [ -f "$pkg" ]; then
            echo "Pushing: $(basename $pkg)"
            dotnet nuget push "$pkg" \
              --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
              --api-key ${{ secrets.GITHUB_TOKEN }} \
              --skip-duplicate \
              --timeout 300
          fi
        done

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        TAG="v$VERSION"
        NOTES_FILE=".github/release-notes/$TAG.md"

        # Package list is generated from what was actually packed, so it never drifts.
        {
          if [ -f "$NOTES_FILE" ]; then cat "$NOTES_FILE"; echo; fi
          echo "### NuGet packages"
          for pkg in ./packages/*.nupkg; do
            name=$(basename "$pkg" ".$VERSION.nupkg")
            echo "- [$name $VERSION](https://www.nuget.org/packages/$name/$VERSION)"
          done
        } > release-body.md

        NOTES_ARGS=(--notes-file release-body.md)
        if [ ! -f "$NOTES_FILE" ]; then NOTES_ARGS+=(--generate-notes); fi

        gh release create "$TAG" ./packages/*.nupkg ./packages/*.snupkg \
          --title "Release $VERSION" \
          --target "$GITHUB_SHA" \
          "${NOTES_ARGS[@]}"

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{ steps.version.outputs.VERSION }}
        path: |
          ./packages/*.nupkg
          ./packages/*.snupkg
        retention-days: 90
